[package]
name = "DSIDE"
version = "0.6.3"
license = "MIT"
description = "An Agentic DeepSeek IDE"
authors = ["Ziggy, Modest"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `image-png` lets the tray icon be embedded as PNG bytes — the window icon was empty in
# the packaged build, which left a blank slot in the panel.
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
tokio = { version = "1", features = ["process", "io-util", "time", "macros", "sync", "rt", "net"] }
regex = "1"
glob = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
# Cropping a window out of a desktop capture; PNG only, no encoders for other formats.
image = { version = "0.25", default-features = false, features = ["png"] }
portable-pty = "0.8"
keyring = { version = "3", features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
    "crypto-rust",
] }

# Only to probe for the appindicator library before the tray crate panics over it.
# `zbus` is already in the tree (through the keyring backend); it is a direct dependency now
# because screenshots inside a Flatpak have to go through the desktop portal.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
zbus = "4"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
